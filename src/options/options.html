<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Model Router — Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
      --card: #f7f7f8; --border: #e5e7eb; --accent: #6d5efc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161618; --fg:#ececec; --muted:#9ca3af; --card:#1e1e22; --border:#2c2c31; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
      padding: 32px 20px 64px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
         color: var(--muted); margin: 28px 0 10px; }
    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 4px 16px; }
    .row { display: flex; align-items: center; justify-content: space-between;
           gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .row .label { font-weight: 500; }
    .row .help { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 46ch; }
    select {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; font: inherit; min-width: 130px;
    }
    /* toggle */
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border);
      border-radius: 999px; transition: .2s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    .actions { margin-top: 28px; display: flex; gap: 10px; }
    button.btn {
      font: inherit; cursor: pointer; padding: 9px 14px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .saved { color: #16a34a; font-size: 12.5px; opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }
    .site-block { margin-top: 8px; }
    .site-block h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
    footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>✨ AI Model Router</h1>
    <p class="help">Route your prompt to the right model automatically. Everything runs locally — no API keys, no network calls.</p>

    <h2>General</h2>
    <div class="card">
      <div class="row">
        <div>
          <div class="label" id="autoModeLabel">Auto mode</div>
          <div class="help" id="autoModeHelp"></div>
        </div>
        <label class="switch"><input type="checkbox" id="autoMode" /><span class="slider"></span></label>
      </div>
    </div>

    <h2>Sites</h2>
    <div class="card" id="sites"></div>

    <h2>Category → tier</h2>
    <div class="card" id="mapping"></div>

    <h2>Tier → model (per site)</h2>
    <div class="card" id="tierModel"></div>

    <div class="actions">
      <button class="btn" id="reset">Reset to defaults</button>
      <span class="saved" id="saved">Saved ✓</span>
    </div>

    <footer>AI Model Router · settings sync across your signed-in Chrome profiles.</footer>
  </div>
  <script type="module" src="./options.js"></script>
</body>
</html>
